name: Build Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Build Flatpak from checked-out source
        run: |
          rm -rf build-dir repo
          flatpak-builder --force-clean --repo=repo build-dir flatpak/io.github.maplemilesalt.LinMine.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle repo LinMine.flatpak io.github.maplemilesalt.LinMine

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v6
        with:
          name: LinMine-flatpak
          path: LinMine.flatpak

      - name: Attach Flatpak to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" LinMine.flatpak --clobber
