name: linmine
base: core24
version: '0.1'
summary: Classic Minesweeper for Linux
description: |
  LinMine is a Linux port of the classic Minesweeper game.
  It uses the original bitmap assets and provides the familiar Minesweeper gameplay.
grade: stable
confinement: strict

title: LinMine
website: https://github.com/maplemilesalt-byte/LinMine
source-code: https://github.com/maplemilesalt-byte/LinMine
issues: https://github.com/maplemilesalt-byte/LinMine/issues

apps:
  linmine:
    command: bin/linmine
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl

parts:
  linmine:
    plugin: nil
    build-packages:
      - build-essential
      - pkg-config
      - libgtk-3-dev
    stage-packages:
      - libgtk-3-0
    override-build: |
      set -eux
      make -C linux
      mkdir -p "$CRAFT_PART_INSTALL/linux" "$CRAFT_PART_INSTALL/bin"
      install -Dm755 linux/linmine "$CRAFT_PART_INSTALL/linux/linmine"
      install -Dm644 linux/winmine-1.png "$CRAFT_PART_INSTALL/linux/winmine-1.png"
      cp -a winmine "$CRAFT_PART_INSTALL/winmine"
      printf '%s\n' '#!/bin/sh' 'cd "$SNAP/linux" || exit 1' 'exec ./linmine "$@"' > "$CRAFT_PART_INSTALL/bin/linmine"
      chmod 755 "$CRAFT_PART_INSTALL/bin/linmine"
